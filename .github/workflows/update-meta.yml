name: Update Dota Meta

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update meta data
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: node scripts/update-meta.js

      - name: Commit updated meta
        run: |
          if git diff --quiet -- meta-data.json; then
            echo "Meta data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add meta-data.json
          git commit -m "Auto-update Dota meta"
          git push
