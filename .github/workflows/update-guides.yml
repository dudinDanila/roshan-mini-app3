name: Update Dota Guides

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-guides:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test STRATZ guides API
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: node scripts/update-guides.js
