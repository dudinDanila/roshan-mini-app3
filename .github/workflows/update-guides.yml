name: Update Dota Guides

on:
  workflow_dispatch:

  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

jobs:
  update-guides:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update guides data
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: node scripts/update-guides.js

      - name: Commit updated guides
        run: |
          if git diff --quiet -- guides-data.json; then
            echo "Guides data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guides-data.json
          git commit -m "Auto-update Dota guides"
          git push
